<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Celada Shopper · iPhone, Mac, iPad y AirPods en Colombia</title>
  <meta name="description" content="Productos Apple originales en Celada Shopper. Paga hasta en 24 cuotas con tu tarjeta, entrega el mismo día en Medellín y envíos a toda Colombia.">
  <meta name="theme-color" content="#fbfbfd">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d1d1f'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>C</text></svg>">
</head>
<body>
  <a class="skip" href="#app">Saltar al contenido</a>

  <div class="announce" role="region" aria-label="Novedades">
    <div class="announce__track" id="announce"></div>
  </div>

  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__logo" href="#/" aria-label="Inicio"><span class="nav__mark">C</span><span class="nav__name"></span></a>
      <nav class="nav__links" id="navLinks" aria-label="Categorías"></nav>
      <div class="nav__actions">
        <button class="icon-btn" id="openSearch" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" id="openCart" aria-label="Carrito">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
          <span class="badge-count" id="cartCount" hidden>0</span>
        </button>
        <button class="icon-btn nav__burger" id="burger" aria-label="Menú" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16M4 16h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"><div class="loading"><span></span></div></main>

  <footer class="footer" id="footer"></footer>

  <!-- Búsqueda -->
  <div class="overlay" id="search" hidden>
    <div class="search">
      <div class="search__bar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="searchInput" type="search" placeholder="Busca iPhone, MacBook, AirPods…" autocomplete="off" aria-label="Buscar productos">
        <button class="icon-btn" data-close aria-label="Cerrar búsqueda">✕</button>
      </div>
      <div class="search__results" id="searchResults"></div>
    </div>
  </div>

  <!-- Carrito -->
  <div class="drawer-backdrop" id="cartBackdrop" hidden></div>
  <aside class="drawer" id="cart" aria-label="Carrito" aria-hidden="true"></aside>

  <!-- WhatsApp -->
  <a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Asesoría por WhatsApp">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="currentColor"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3Zm0 23.7c-2 0-4-.5-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.7 10.7 0 1 1 16 26.7Zm5.9-8c-.3-.2-1.9-1-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.8 8.8 0 0 1-4.4-3.8c-.3-.6.3-.5 1-1.7.1-.2 0-.4 0-.6l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.3 1.4 3.5c.2.2 2.4 3.7 5.8 5.1 2.2.9 3 1 4.1.8.7-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5l-.6-.3Z"/></svg>
    <span class="wa-float__label">¿Te asesoramos?</span>
  </a>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/data/catalog.js"></script>
  <script src="assets/js/shopify.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
